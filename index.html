<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="google-site-verification" content="qJGTvUX6gDkqlNoza4qeIFyQyrgtE-45fjNJosWu5us" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Duka Shop Manager by CodeVent Digital — Inventory & Sales App for businesses</title>
<meta name="description" content="Duka Shop Manager, built by CodeVent Digital, helps business owners track products, inventory, sales, and profit, with an AI assistant that reads and explains your business data. Works offline, installs like a native app." />
<meta name="theme-color" content="#0F6B4C" />
<!-- I will update this one line when dukashopmanager.com goes live: change the
     domain below, and set up a 301 redirect from pages.dev/workers.dev
     to it at the same time. Hardcoded on purpose, not derived from
     window.location, so every mirror of this site (pages.dev,
     workers.dev, the eventual custom domain) points Google at the
     same single canonical URL instead of each one claiming itself. -->
<link rel="canonical" href="https://dukashopmanager.pages.dev/" />

<!-- Open Graph / social sharing previews -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="CodeVent Digital" />
<meta property="og:title" content="Duka Shop Manager by CodeVent Digital" />
<meta property="og:description" content="Track products, inventory, sales, and profit, with an AI assistant that explains your business data. Built by CodeVent Digital." />
<meta property="og:url" content="https://dukashopmanager.pages.dev/" />
<meta property="og:image" content="https://dukashopmanager.pages.dev/icons/icon-512.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Duka Shop Manager by CodeVent Digital" />
<meta name="twitter:description" content="Track products, inventory, sales, and profit, with an AI assistant that explains your business data." />
<meta name="twitter:image" content="https://dukashopmanager.pages.dev/icons/icon-512.png" />

<!-- Tells Google this is a distinct product by CodeVent Digital, not a
     generic "duka" (Swahili for "shop") listing. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Duka Shop Manager",
  "alternateName": "Duka",
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "Web, Android, iOS",
  "description": "Track products, inventory, sales, and profit, with an AI assistant that reads and explains your business data.",
  "url": "https://dukashopmanager.pages.dev/",
  "creator": { "@type": "Organization", "name": "CodeVent Digital", "url": "https://codeventdigital.site" },
  "publisher": { "@type": "Organization", "name": "CodeVent Digital", "url": "https://codeventdigital.site" }
}
</script>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/tailwind.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-paper text-ink font-body antialiased min-h-screen pb-20 md:pb-0 md:pl-64">

  <!-- Desktop sidebar -->
  <aside id="sidebar-aside" class="hidden md:flex md:flex-col md:fixed md:inset-y-0 md:left-0 md:w-64 bg-primary-dark text-white px-5 py-6">
    <div class="font-display text-2xl font-extrabold tracking-tight mb-8">Duka</div>
    <nav class="flex flex-col gap-1" id="sidebar-nav"></nav>
    <div class="mt-auto text-xs text-white/60 pt-6">Simple stock and sales, in your pocket.</div>
  </aside>

  <!-- Top bar (mobile) -->
  <header id="mobile-header" class="md:hidden sticky top-0 z-30 bg-primary-dark text-white px-4 py-3 flex items-center justify-between">
    <span class="font-display text-lg font-extrabold" id="mobile-title">Dashboard</span>
    <span id="offline-pill" class="hidden text-xs bg-white/15 rounded-full px-2 py-1">Offline</span>
  </header>

  <main id="app" class="max-w-3xl mx-auto px-4 py-5 md:py-8"></main>

  <!-- Footer -->
  <footer class="max-w-3xl mx-auto px-4 pb-6 pt-2 text-center">
    <div class="flex flex-wrap justify-center gap-x-4 gap-y-1 text-xs text-ink/50 mb-2">
      <button onclick="showFooterInfo('about')" class="hover:text-primary-dark underline-offset-2 hover:underline">About</button>
      <button onclick="showFooterInfo('support')" class="hover:text-primary-dark underline-offset-2 hover:underline">Support</button>
      <button onclick="showFooterInfo('privacy')" class="hover:text-primary-dark underline-offset-2 hover:underline">Privacy Policy</button>
      <button onclick="showFooterInfo('terms')" class="hover:text-primary-dark underline-offset-2 hover:underline">Terms of Service</button>
      <a href="mailto:dukashopmanager@gmail.com" class="hover:text-primary-dark underline-offset-2 hover:underline">dukashopmanager@gmail.com</a>
    </div>
    <p class="text-xs text-ink/30">© Duka Shop Manager. All rights reserved.</p>
  </footer>

  <!-- Bottom nav (mobile) -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-surface border-t border-black/5 flex justify-around py-1.5" id="bottom-nav"></nav>

  <!-- Footer info modal (About / Support / Privacy / Terms) -->
  <div id="info-modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-end md:items-center justify-center">
    <div class="bg-surface w-full md:max-w-md rounded-t-3xl md:rounded-3xl p-6 max-h-[80vh] overflow-y-auto" id="info-modal-body"></div>
  </div>

  <!-- Sell modal -->
  <div id="sell-modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-end md:items-center justify-center">
    <div class="bg-surface w-full md:max-w-sm rounded-t-3xl md:rounded-3xl p-6" id="sell-modal-body"></div>
  </div>

  <!-- Multi Sale modal -->
  <div id="multisale-modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-end md:items-center justify-center">
    <div class="bg-surface w-full md:max-w-lg rounded-t-3xl md:rounded-3xl p-6 max-h-[90vh] overflow-y-auto" id="multisale-modal-body"></div>
  </div>

  <!-- Credit Sale modal -->
  <div id="creditsale-modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-end md:items-center justify-center">
    <div class="bg-surface w-full md:max-w-lg rounded-t-3xl md:rounded-3xl p-6 max-h-[90vh] overflow-y-auto" id="creditsale-modal-body"></div>
  </div>

  <!-- Sale detail modal -->
  <div id="sale-detail-modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-end md:items-center justify-center">
    <div class="bg-surface w-full md:max-w-sm rounded-t-3xl md:rounded-3xl p-6" id="sale-detail-modal-body"></div>
  </div>

  <!-- Credit sale detail modal -->
  <div id="credit-detail-modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-end md:items-center justify-center">
    <div class="bg-surface w-full md:max-w-sm rounded-t-3xl md:rounded-3xl p-6 max-h-[90vh] overflow-y-auto" id="credit-detail-modal-body"></div>
  </div>

  <!-- Add stock modal -->
  <div id="stock-modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-end md:items-center justify-center">
    <div class="bg-surface w-full md:max-w-sm rounded-t-3xl md:rounded-3xl p-6" id="stock-modal-body"></div>
  </div>

  <!-- Product form modal -->
  <div id="product-modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-end md:items-center justify-center overflow-y-auto">
    <div class="bg-surface w-full md:max-w-md rounded-t-3xl md:rounded-3xl p-6 my-auto" id="product-modal-body"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-24 md:bottom-6 left-1/2 -translate-x-1/2 z-50 bg-ink text-white text-sm px-4 py-2.5 rounded-full shadow-lg"></div>

  <script src="js/app.js"></script>
</body>
</html>
